[build-system]
requires = ["setuptools>=75,<82"]
build-backend = "setuptools.build_meta"

[project]
name = "investopt"
version = "1.0.0"
description = "Offline synthetic international acquisition analytics and planning"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3", "pandas>=2.2,<3", "pyarrow>=17,<24",
  "duckdb>=1.2,<2", "scikit-learn>=1.5,<2", "scipy>=1.13,<2",
  "statsmodels>=0.14,<0.15", "streamlit>=1.50,<2", "plotly>=5.24,<7",
  "joblib>=1.4,<2", "openpyxl>=3.1,<4", "pyyaml>=6,<7"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[project.scripts]
investopt = "investopt.__main__:main"

[tool.setuptools.packages.find]
include = ["investopt*"]

[tool.setuptools.package-data]
investopt = ["sql/*.sql", "defaults/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
